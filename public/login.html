<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 text-white font-sans h-full flex items-center justify-center p-4">

<div class="w-full max-w-sm bg-gray-900 rounded-xl shadow-md p-6 md:p-8">
    <div class="uppercase tracking-wide text-xs md:text-sm text-indigo-500 font-semibold mb-4">Connexion</div>
    <p class="text-sm text-gray-400 mb-6">Accès réservé aux joueurs et au MJ. Entrez le mot de passe partagé.</p>

    <p id="login-error" class="hidden mb-4 text-sm text-red-400">Mot de passe incorrect. Réessayez.</p>

    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label for="password" class="block text-xs font-medium text-gray-400">Mot de passe</label>
            <input type="password" id="password" name="password" autofocus class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base">
        </div>
        <input type="hidden" id="next" name="next" value="/create">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-3 px-4 rounded-lg shadow-sm transition-colors">
            Se connecter
        </button>
    </form>

    <a href="/" class="block mt-6 text-center text-xs font-semibold text-gray-400 hover:text-white transition-colors">← Retour au portail</a>
</div>

<script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next');
    if (next) document.getElementById('next').value = next;
    if (params.get('e') === '1') document.getElementById('login-error').classList.remove('hidden');
</script>
</body>
</html>
