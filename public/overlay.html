<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Overlay JdR Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="overlay.css">
</head>
<body>

    <!-- Zone Boss -->
    <div id="boss-container">
        <div class="boss-header">
            <h2 id="boss-name">Nom du Boss</h2>
        </div>
        <div class="boss-hp-frame">
            <div id="boss-hp-bar"></div>
            <span id="boss-hp-text">0 / 0</span>
        </div>
    </div>

    <!-- Zone pour l'affichage des images projetées par le MJ -->
    <div id="image-display-area">
        <img id="projected-image" src="" alt="Image projetée">
    </div>

    <!-- Zone pour les notifications de lancers de dés (Nom du joueur + Résultat) -->
    <div id="dice-roll-display"></div>

    <!-- Conteneur pour les fiches des joueurs -->
    <div id="player-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="overlay.js"></script>
</body>
</html>
